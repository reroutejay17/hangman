<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="hangman.css">
    <script src="hangman.js"></script>
    <title>Hangman</title>
</head>
<body>
<div>
    <img id="hangmanpic" src="images/hangman6.gif" alt="Picture of Hangman">
</div>
<div id="clue">Press New Game to Play</div>
<div>
    <input type="text" id="guess" size="1" maxlength="1">
    <button onclick="guess();">Guess</button>
</div>
<div>
    <div id="guesses"></div>
    <div id="newgamearea">
        <button onclick="newGame();">New Game</button>
    </div>
</div>
</body>
</html>
